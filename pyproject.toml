[project]
name = "resume-llm"
version = "0.1.0"
description = "A project for resume building and review using LLMs."
authors = [
    { name = "Jack Stehn", email = "jack.stehn+github@protonmail.com" }
]
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "requests",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-ollama>=1.1",
    "langchain-huggingface>=1.2",
    "langgraph>=1.2",
    "jsonschema",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pylint",
    "pytest",
    "pre-commit",
    "isort",
    "types-jsonschema"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[tool.pylint]
max-line-length = 88
